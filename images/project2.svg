<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="scada-header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Background Lines -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <circle cx="300" cy="180" r="140" fill="none" />
    <circle cx="300" cy="180" r="240" fill="none" />
  </g>

  <!-- Title -->
  <text x="30" y="40" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#38bdf8" letter-spacing="1">
    REDUNDANT PLC &amp; SCADA SYSTEM
  </text>

  <!-- Left: Redundant PLC Enclosure representation -->
  <g transform="translate(40, 70)">
    <!-- Cabinet Box -->
    <rect width="200" height="230" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="2" />
    <text x="100" y="24" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#94a3b8" text-anchor="middle">CONTROL CABINET</text>
    
    <!-- Redundant Siemens PLC Modules -->
    <!-- CPU A (Active) -->
    <g transform="translate(25, 45)">
      <rect width="65" height="150" rx="3" fill="#1e293b" stroke="#f97316" stroke-width="2" filter="url(#glow)"/>
      <rect x="5" y="10" width="55" height="25" fill="#020617" />
      <text x="32" y="25" font-family="monospace" font-weight="700" font-size="8" fill="#10b981" text-anchor="middle">RUN/ACT</text>
      <!-- Led bars -->
      <line x1="15" y1="50" x2="50" y2="50" stroke="#10b981" stroke-width="3" />
      <line x1="15" y1="60" x2="50" y2="60" stroke="#10b981" stroke-width="3" />
      <line x1="15" y1="70" x2="50" y2="70" stroke="#94a3b8" stroke-width="3" />
      <text x="32" y="130" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" fill="#f8fafc" text-anchor="middle">CPU-1517H</text>
      <text x="32" y="142" font-family="'Outfit', sans-serif" font-weight="600" font-size="7" fill="#64748b" text-anchor="middle">PRIMARY</text>
    </g>

    <!-- CPU B (Standby Hot Sync) -->
    <g transform="translate(110, 45)">
      <rect width="65" height="150" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="5" y="10" width="55" height="25" fill="#020617" />
      <text x="32" y="25" font-family="monospace" font-weight="700" font-size="8" fill="#f59e0b" text-anchor="middle">RUN/STBY</text>
      <!-- Led bars -->
      <line x1="15" y1="50" x2="50" y2="50" stroke="#10b981" stroke-width="3" />
      <line x1="15" y1="60" x2="50" y2="60" stroke="#94a3b8" stroke-width="3" />
      <line x1="15" y1="70" x2="50" y2="70" stroke="#10b981" stroke-width="3" />
      <text x="32" y="130" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" fill="#f8fafc" text-anchor="middle">CPU-1517H</text>
      <text x="32" y="142" font-family="'Outfit', sans-serif" font-weight="600" font-size="7" fill="#64748b" text-anchor="middle">STANDBY</text>
    </g>

    <!-- Hot Standby Sync Fiber Cable -->
    <path d="M 75,130 L 125,130" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2" />
    <text x="100" y="125" font-family="sans-serif" font-size="6" fill="#ef4444" text-anchor="middle" font-weight="700">FIBER SYNC</text>
  </g>

  <!-- Right: Modern SCADA Dashboard Interface representation -->
  <g transform="translate(280, 70)" filter="url(#glow)">
    <!-- Monitor Bezel -->
    <rect width="280" height="205" rx="6" fill="#090d16" stroke="#334155" stroke-width="3" />
    <!-- Stand -->
    <polygon points="400,275 440,275 430,300 410,300" fill="#334155" />
    <rect x="380" y="300" width="80" height="6" rx="2" fill="#334155" />

    <!-- Screen Area -->
    <rect x="5" y="5" width="270" height="195" rx="3" fill="#0f172a" />
    
    <!-- SCADA Header -->
    <rect x="5" y="5" width="270" height="20" fill="url(#scada-header)" />
    <circle cx="20" cy="15" r="4" fill="#ef4444" />
    <circle cx="30" cy="15" r="4" fill="#f59e0b" />
    <circle cx="40" cy="15" r="4" fill="#10b981" />
    <text x="140" y="18" font-family="sans-serif" font-weight="700" font-size="8" fill="#94a3b8" text-anchor="middle">THI VAI GAS STATION SCADA</text>

    <!-- Graphic display (Flow loops) -->
    <!-- Valve drawing -->
    <polygon points="40,55 70,55 40,85 70,85" fill="none" stroke="#10b981" stroke-width="2" />
    <circle cx="55" cy="70" r="6" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="55" y="50" font-family="sans-serif" font-size="7" fill="#10b981" text-anchor="middle" font-weight="700">XV-101 (OPEN)</text>

    <!-- Gauge dial -->
    <circle cx="170" cy="80" r="28" fill="#020617" stroke="#38bdf8" stroke-width="2" />
    <path d="M 170,80 L 184,66" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="170" cy="80" r="3" fill="white" />
    <text x="170" y="98" font-family="'Outfit', sans-serif" font-weight="700" font-size="8" fill="#38bdf8" text-anchor="middle">48.6 barg</text>
    <text x="170" y="112" font-family="sans-serif" font-size="6" fill="#64748b" text-anchor="middle">PRESSURE</text>

    <!-- Trend Chart -->
    <rect x="20" y="115" width="240" height="70" rx="3" fill="#020617" stroke="#1e293b" stroke-width="1" />
    <path d="M 20,170 Q 50,130 80,150 T 140,125 T 200,160 T 260,130" fill="none" stroke="url(#cyan-glow)" stroke-width="2" />
    <!-- Grid inside chart -->
    <line x1="20" y1="130" x2="260" y2="130" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="20" y1="150" x2="260" y2="150" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 2" />
    <text x="25" y="128" font-family="monospace" font-size="7" fill="#64748b">FLOW TREND</text>
  </g>

  <!-- Network communication line from Cabinet to SCADA -->
  <path d="M 240,185 C 260,185 260,120 280,120" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 3" />
  <circle cx="260" cy="150" r="10" fill="#020617" stroke="#10b981" stroke-width="1.5" />
  <text x="260" y="153" font-family="sans-serif" font-weight="700" font-size="6" fill="#10b981" text-anchor="middle">TCP/IP</text>
</svg>
