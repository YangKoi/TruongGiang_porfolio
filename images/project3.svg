<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="fluke-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <path d="M 0,90 L 600,90 M 0,180 L 600,180 M 0,270 L 600,270" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360" />
  </g>

  <!-- Title -->
  <text x="30" y="40" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#10b981" letter-spacing="1">
    AUTOMATED CALIBRATION LOOP (ISO 17025)
  </text>

  <!-- Left Side: Digital Pressure Controller & Pump -->
  <g transform="translate(50, 70)">
    <!-- Base pump box -->
    <rect width="180" height="150" rx="6" fill="#334155" stroke="#475569" stroke-width="2" />
    <rect x="15" y="15" width="150" height="50" rx="3" fill="#020617" />
    <!-- Pressure gauge display -->
    <text x="90" y="46" font-family="monospace" font-weight="700" font-size="18" fill="#10b981" text-anchor="middle">5.0000 bar</text>
    <text x="25" y="32" font-family="sans-serif" font-size="7" fill="#64748b">GENERATED PRESS</text>
    
    <!-- Knobs and hoses connection -->
    <circle cx="50" cy="100" r="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="130" cy="100" r="14" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="80" y="90" width="20" height="20" fill="#1e293b" />
    
    <!-- Pressure Tubing Out -->
    <path d="M 90,110 L 90,260 L 310,260 L 310,195" fill="none" stroke="#94a3b8" stroke-width="6" />
    <path d="M 90,110 L 90,260 L 310,260 L 310,195" fill="none" stroke="#0ea5e9" stroke-width="2" />
    <text x="160" y="252" font-family="sans-serif" font-size="7" fill="#0ea5e9" font-weight="700">PRESSURE LINE</text>
  </g>

  <!-- Right Side: Device Under Test (Smart Pressure Transmitter) -->
  <g transform="translate(260, 60)" filter="url(#glow)">
    <rect width="100" height="135" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    
    <!-- Blue neck representation of Rosemount-style transmitter -->
    <rect x="35" y="5" width="30" height="15" fill="#0ea5e9" />
    <circle cx="50" cy="45" r="28" fill="#0ea5e9" />
    <circle cx="50" cy="45" r="22" fill="#020617" />
    <!-- Transmitter Digital Display -->
    <text x="50" y="47" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700">4.9982</text>
    <text x="50" y="58" font-family="monospace" font-size="6" fill="#38bdf8" text-anchor="middle">bar</text>
    
    <!-- Terminal connection block -->
    <rect x="25" y="85" width="50" height="35" fill="#334155" />
    <circle cx="40" cy="102" r="4" fill="#ef4444" />
    <circle cx="60" cy="102" r="4" fill="#020617" stroke="white" stroke-width="0.5" />
    
    <text x="50" y="130" font-family="'Outfit', sans-serif" font-weight="700" font-size="8" fill="#f8fafc" text-anchor="middle">TX-102 DUT</text>
  </g>

  <!-- Far Right: Documenting Calibrator (Fluke style) -->
  <g transform="translate(420, 70)" filter="url(#glow)">
    <rect width="120" height="230" rx="8" fill="url(#fluke-body)" stroke="#d97706" stroke-width="2" />
    
    <!-- Screen -->
    <rect x="10" y="15" width="100" height="95" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="15" y="32" font-family="sans-serif" font-size="6" fill="#f59e0b" font-weight="700">FLUKE AUTO LOOP</text>
    
    <!-- Input/Output Channels -->
    <rect x="15" y="42" width="90" height="25" fill="#020617" />
    <text x="20" y="58" font-family="monospace" font-size="12" fill="#10b981">S: 5.0000</text>
    <text x="95" y="58" font-family="monospace" font-size="7" fill="#64748b" text-anchor="end">bar</text>

    <rect x="15" y="74" width="90" height="25" fill="#020617" />
    <text x="20" y="90" font-family="monospace" font-size="12" fill="#ef4444">M: 4.9982</text>
    <text x="95" y="90" font-family="monospace" font-size="7" fill="#64748b" text-anchor="end">mA</text>

    <!-- Buttons -->
    <g fill="#4b5563" stroke="#1f2937" stroke-width="1">
      <rect x="15" y="125" width="25" height="15" rx="2" />
      <rect x="47" y="125" width="25" height="15" rx="2" />
      <rect x="80" y="125" width="25" height="15" rx="2" />
      
      <circle cx="25" cy="165" r="10" fill="#374151" />
      <circle cx="60" cy="165" r="10" fill="#374151" />
      <circle cx="95" cy="165" r="10" fill="#374151" />
      
      <rect x="15" y="190" width="90" height="20" rx="3" fill="#10b981" />
    </g>
    <text x="60" y="203" font-family="sans-serif" font-weight="700" font-size="8" fill="white" text-anchor="middle">CALIBRATE NOW</text>
  </g>

  <!-- Electrical test leads from Fluke to Transmitter terminals -->
  <!-- Positive red wire -->
  <path d="M 435,215 C 380,215 340,162 300,162" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
  <!-- Negative black wire -->
  <path d="M 455,215 C 400,280 340,210 320,162" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

  <!-- HART protocol symbol on wire -->
  <g transform="translate(345, 175)">
    <circle cx="10" cy="10" r="10" fill="#d97706" />
    <path d="M 5,10 Q 10,2 15,10 T 25,10" fill="none" stroke="white" stroke-width="1" />
    <text x="10" y="17" font-family="sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="700">HART</text>
  </g>
</svg>
