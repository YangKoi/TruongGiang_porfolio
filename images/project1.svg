<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="pipe-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gas-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.1)"/>
      <stop offset="50%" stop-color="rgba(14, 165, 233, 0.6)"/>
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.1)"/>
    </linearGradient>
    <linearGradient id="orange-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- High-tech Grid Background -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <path d="M 0,60 L 600,60 M 0,120 L 600,120 M 0,180 L 600,180 M 0,240 L 600,240 M 0,300 L 600,300" />
    <path d="M 100,0 L 100,360 M 200,0 L 200,360 M 300,0 L 300,360 M 400,0 L 400,360 M 500,0 L 500,360" />
  </g>

  <!-- Gas Metering Header Label -->
  <text x="30" y="40" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#0ea5e9" letter-spacing="1">
    AGA 9 ULTRASONIC CUSTODY TRANSFER SKID
  </text>

  <!-- Piping Network (3-run metering system) -->
  <!-- Main Header In -->
  <path d="M 30,180 L 120,180 L 120,90 L 480,90 L 480,180" fill="none" stroke="url(#pipe-grad)" stroke-width="16" stroke-linejoin="round" />
  <path d="M 120,180 L 480,180" fill="none" stroke="url(#pipe-grad)" stroke-width="16" stroke-linejoin="round" />
  <path d="M 120,180 L 120,270 L 480,270 L 480,180 L 570,180" fill="none" stroke="url(#pipe-grad)" stroke-width="16" stroke-linejoin="round" />

  <!-- Animated-like Gas Flows inside the pipes -->
  <g stroke="url(#gas-flow)" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 30,180 L 120,180 L 120,90 L 480,90 L 480,180 L 570,180" stroke-dasharray="20 15 10 15" />
    <path d="M 120,180 L 480,180" stroke-dasharray="15 20 25 15" />
    <path d="M 120,180 L 120,270 L 480,270 L 480,180" stroke-dasharray="25 10 15 20" />
  </g>

  <!-- Ultrasonic Flowmeters on the runs -->
  <!-- Run 1 (Top) -->
  <g transform="translate(250, 75)">
    <rect width="100" height="30" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <rect x="25" y="5" width="50" height="20" rx="2" fill="url(#orange-glow)" filter="url(#glow)"/>
    <path d="M 15,5 L 30,25 M 35,5 L 50,25 M 55,5 L 70,25 M 75,5 L 90,25" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
    <text x="50" y="18" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" fill="white" text-anchor="middle">AGA 9 METER 1</text>
  </g>

  <!-- Run 2 (Middle) -->
  <g transform="translate(250, 165)">
    <rect width="100" height="30" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <rect x="25" y="5" width="50" height="20" rx="2" fill="url(#orange-glow)" filter="url(#glow)"/>
    <path d="M 15,5 L 30,25 M 35,5 L 50,25 M 55,5 L 70,25 M 75,5 L 90,25" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
    <text x="50" y="18" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" fill="white" text-anchor="middle">AGA 9 METER 2</text>
  </g>

  <!-- Run 3 (Bottom) -->
  <g transform="translate(250, 255)">
    <rect width="100" height="30" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <rect x="25" y="5" width="50" height="20" rx="2" fill="#10b981" />
    <path d="M 15,5 L 30,25 M 35,5 L 50,25 M 55,5 L 70,25 M 75,5 L 90,25" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
    <text x="50" y="18" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" fill="white" text-anchor="middle">STBY METER 3</text>
  </g>

  <!-- Flow Computer telemetry dashboard overlay (conceptual representation) -->
  <g transform="translate(30, 260)" filter="url(#glow)">
    <rect width="150" height="70" rx="10" fill="rgba(16, 25, 44, 0.85)" stroke="url(#orange-glow)" stroke-width="1.5" />
    <text x="15" y="22" font-family="'Outfit', sans-serif" font-weight="700" font-size="10" fill="#f97316">OMNI REDUNDANT</text>
    <text x="15" y="42" font-family="monospace" font-weight="700" font-size="14" fill="#f8fafc">Q: 145,280 m³</text>
    <text x="15" y="58" font-family="monospace" font-weight="700" font-size="10" fill="#10b981">SYS: VALIDATED</text>
    
    <!-- Pulse signal light -->
    <circle cx="135" cy="18" r="4" fill="#10b981" />
  </g>

  <!-- Pressure and Temperature transmitters -->
  <g transform="translate(430, 65)">
    <circle cx="10" cy="10" r="10" fill="#38bdf8" />
    <line x1="10" y1="20" x2="10" y2="40" stroke="#38bdf8" stroke-width="1.5" />
    <text x="10" y="14" font-family="sans-serif" font-weight="700" font-size="8" fill="black" text-anchor="middle">PT</text>
  </g>
  <g transform="translate(455, 65)">
    <circle cx="10" cy="10" r="10" fill="#38bdf8" />
    <line x1="10" y1="20" x2="10" y2="40" stroke="#38bdf8" stroke-width="1.5" />
    <text x="10" y="14" font-family="sans-serif" font-weight="700" font-size="8" fill="black" text-anchor="middle">TT</text>
  </g>
</svg>
