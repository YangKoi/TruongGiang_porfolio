<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background with high-tech radial gradient -->
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </radialGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="secondary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- High-tech Grid Lines and Circles in Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <circle cx="200" cy="200" r="150" fill="none" />
    <circle cx="200" cy="200" r="100" fill="none" />
    <circle cx="200" cy="200" r="50" fill="none" />
  </g>

  <!-- Glowing tech connections -->
  <g stroke="url(#secondary-grad)" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 200,50 L 250,100 L 350,100" />
    <path d="M 200,350 L 150,300 L 50,300" />
    <circle cx="350" cy="100" r="4" fill="#0ea5e9" />
    <circle cx="50" cy="300" r="4" fill="#0ea5e9" />
  </g>

  <!-- Central Shield/Badge structure representing automation and safety -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <!-- Hexagon Outer Border -->
    <polygon points="100,0 200,50 200,150 100,200 0,150 0,50" fill="none" stroke="url(#primary-grad)" stroke-width="3" />
    
    <!-- Innner Hexagon -->
    <polygon points="100,15 185,58 185,142 100,185 15,142 15,58" fill="rgba(16, 25, 44, 0.7)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Automation Telemetry Logo (Flame + Flow Rings) -->
    <!-- Core Flow rings -->
    <circle cx="100" cy="100" r="45" fill="none" stroke="url(#secondary-grad)" stroke-width="2" stroke-dasharray="15 5 8 5" />
    <circle cx="100" cy="100" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Gas Flame in the center representing Oil & Gas -->
    <path d="M 100,65 C 112,85 120,95 120,110 C 120,121 111,130 100,130 C 89,130 80,121 80,110 C 80,95 88,85 100,65 Z" 
          fill="url(#primary-grad)" />
    <!-- Small inner flame -->
    <path d="M 100,85 C 106,97 110,103 110,112 C 110,118 105,123 100,123 C 95,123 90,118 90,112 C 90,103 94,97 100,85 Z" 
          fill="#facc15" />
  </g>

  <!-- Overlay Text or Tech Accents -->
  <text x="200" y="340" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="20" fill="#f8fafc" letter-spacing="4">
    GIANG.E&amp;I
  </text>
  <text x="200" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#0ea5e9" letter-spacing="2">
    MEASUREMENT &amp; AUTOMATION
  </text>
</svg>
