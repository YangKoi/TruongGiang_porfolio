<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background with dark industrial gradient -->
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#070c14"/>
    </radialGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dd6b20"/>
    </linearGradient>
    <linearGradient id="secondary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- High-tech Grid and Telemetry Elements -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <circle cx="200" cy="200" r="160" fill="none" />
    <circle cx="200" cy="200" r="120" fill="none" stroke-dasharray="5 5" />
    <circle cx="200" cy="200" r="80" fill="none" />
  </g>

  <!-- Glowing outer ring -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#secondary-grad)" stroke-width="2" stroke-opacity="0.25" filter="url(#glow)" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="40 180 90 90" />

  <!-- Technical tick marks -->
  <g stroke="url(#secondary-grad)" stroke-width="2" stroke-opacity="0.4">
    <line x1="200" y1="60" x2="200" y2="70" />
    <line x1="200" y1="330" x2="200" y2="340" />
    <line x1="60" y1="200" x2="70" y2="200" />
    <line x1="330" y1="200" x2="340" y2="200" />
  </g>

  <!-- Stylized generic user silhouette in center -->
  <g transform="translate(0, 0)" filter="url(#glow)">
    <!-- Head -->
    <circle cx="200" cy="165" r="45" fill="none" stroke="url(#primary-grad)" stroke-width="3" />
    <circle cx="200" cy="165" r="38" fill="#1e293b" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" />
    <path d="M 180,165 Q 200,150 220,165" fill="none" stroke="url(#secondary-grad)" stroke-width="2" stroke-opacity="0.5" />
    
    <!-- Shoulders/Torso -->
    <path d="M 120,290 C 120,240 150,225 200,225 C 250,225 280,240 280,290" fill="none" stroke="url(#primary-grad)" stroke-width="3" />
    <path d="M 125,290 C 125,245 152,232 200,232 C 248,232 275,245 275,290 Z" fill="#1e293b" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" />
    
    <!-- Crosshairs inside body representation -->
    <line x1="200" y1="235" x2="200" y2="280" stroke="url(#secondary-grad)" stroke-dasharray="4 4" stroke-opacity="0.5" />
    <circle cx="200" cy="255" r="10" fill="none" stroke="url(#secondary-grad)" stroke-opacity="0.5" />
  </g>

  <!-- "Insert Photo Here" Text -->
  <rect x="120" y="300" width="160" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="url(#secondary-grad)" stroke-opacity="0.3" stroke-width="1" />
  <text x="200" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#94a3b8" letter-spacing="1">
    INSERT PHOTO HERE
  </text>

  <!-- Technical border accents -->
  <path d="M 40,40 L 40,20 L 60,20" fill="none" stroke="url(#secondary-grad)" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 360,40 L 360,20 L 340,20" fill="none" stroke="url(#secondary-grad)" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 40,360 L 40,380 L 60,380" fill="none" stroke="url(#secondary-grad)" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 360,360 L 360,380 L 340,380" fill="none" stroke="url(#secondary-grad)" stroke-width="2" stroke-opacity="0.5" />
</svg>
